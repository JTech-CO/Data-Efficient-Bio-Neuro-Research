name: Synthetic research checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-lab.txt
      - run: python -m pytest research_lab/tests -q
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_research_lab.py
      - run: python -m research_lab run --budget 12 --out research_lab/results/ci-smoke.json
