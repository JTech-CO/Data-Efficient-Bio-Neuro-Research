name: v1.3 synthetic research checks
on:
  push:
    paths: ['research/triad_loop/**', 'research/triad/**', '.github/workflows/triad-ci.yml']
  pull_request:
    paths: ['research/triad_loop/**', 'research/triad/**', '.github/workflows/triad-ci.yml']
jobs:
  contracts-and-numerics:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s research/tests -v
      - run: python -m unittest discover -s research/followup/tests -v
      - run: python -m unittest discover -s research/triad/tests -v
