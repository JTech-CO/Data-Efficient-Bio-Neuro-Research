name: Synthetic research checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r research/requirements.txt -r examples/requirements-tested.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s research/tests -v
      - run: python research/validate_research.py
      - run: python -m research.closed_loop run --scenario mechanism_outside --policy guarded --seed 29 --output research/results/ci-smoke.json
      - run: python -m research.closed_loop audit research/results/ci-smoke.json
